# Render Blueprint — API Spring Boot (Docker)
# Banco de Dados via Neon
services:
  - type: web
    name: book-manager-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRACAO
        value: PT8H
      - key: CORS_ORIGENS
        sync: false
