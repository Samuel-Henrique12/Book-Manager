# Render Blueprint — API Spring Boot (Docker)
# Banco de Dados via Neon
# Caminhos da Raiz do Repositorio:
services:
  - type: web
    name: book-manager-api
    runtime: docker
    branch: main
    region: virginia
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # Perfil Ativador de Fail-Fast de Secrets (ValidadorDeSegredos)
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRACAO
        value: PT8H
      - key: CORS_ORIGENS
        sync: false
      # E-mail por API HTTP
      - key: EMAIL_PROVEDOR
        value: brevo
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NOME
        value: Book Manager
      # URL do Front na Vercel
      - key: APP_URL_BASE
        sync: false
      # Google Books
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: GOOGLE_BOOKS_IDIOMA
        value: pt
      - key: GOOGLE_BOOKS_MAX_POR_TEMA
        value: "200"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
