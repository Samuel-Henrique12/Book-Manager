# Render Blueprint — API Spring Boot (Docker)
# Banco de Dados via Neon
# Caminhos da Raiz do Repositorio:
services:
  - type: web
    name: book-manager-api
    runtime: docker
    branch: main
    region: virginia
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRACAO
        value: PT8H
      - key: CORS_ORIGENS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
