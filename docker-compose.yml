services:
  db:
    image: postgres:16-alpine
    container_name: bookmanager-db
    environment:
      POSTGRES_DB: ${DB_NAME:-bookmanager}
      POSTGRES_USER: ${DB_USERNAME:-bookmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookmanager}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bookmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP de Dev: Caixa de Entrada em http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: bookmanager-mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"

  api:
    build: ./backend
    container_name: bookmanager-api
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bookmanager}
      DB_USERNAME: ${DB_USERNAME:-bookmanager}
      DB_PASSWORD: ${DB_PASSWORD:-bookmanager}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-desenvolvimento-com-no-minimo-32-bytes}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-PT8H}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:3000}
      EMAIL_PROVEDOR: ${EMAIL_PROVEDOR:-smtp}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM_NOME: ${MAIL_FROM_NOME:-Book Manager}
      MAIL_HOST: ${MAIL_HOST:-mail}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-nao-responda@bookmanager.local}
      APP_URL_BASE: ${APP_URL_BASE:-http://localhost:3000}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: bookmanager-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db_data:
